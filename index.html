<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostPilot – Standard Forms & Standard Forms Immo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--panel2:#1f2440;--line:#2a3052;--txt:#e8ebff;--mut:#8b93c0;--acc:#6c7bff;--acc2:#38d9a9;--warn:#ffb84d;--bad:#ff6b81;--li:#0a66c2;--fb:#1877f2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--txt);display:flex;min-height:100vh}
aside{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;font-size:20px;margin:0 8px 24px}.logo span{color:var(--acc)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:4px}
nav button:hover{background:var(--panel2);color:var(--txt)}nav button.on{background:var(--acc);color:#fff}
main{flex:1;padding:28px;max-width:1200px;min-width:0}
h1{margin:0 0 4px;font-size:24px}.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.kpi .v{font-size:28px;font-weight:700;margin-top:6px}
.two{grid-template-columns:2fr 1fr}@media(max-width:900px){.two{grid-template-columns:1fr}aside{display:none}body{display:block}.mnav{display:flex!important}}
.mnav{display:none;gap:6px;overflow:auto;padding:10px;background:var(--panel);position:sticky;top:0;z-index:5}.mnav button{background:var(--panel2);border:0;color:var(--txt);padding:8px 12px;border-radius:8px;white-space:nowrap}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:wait}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:12px}.btn.ok{background:var(--acc2);color:#04241b}.btn.del{background:none;color:var(--bad);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.f1{flex:1!important}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700}.tag.li{background:var(--li)}.tag.fb{background:var(--fb)}.tag.draft{background:var(--panel2);color:var(--mut)}.tag.pub{background:var(--acc2);color:#04241b}
.post{margin-bottom:14px}.post pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.55;margin:12px 0;background:var(--bg);padding:14px;border-radius:10px;border:1px solid var(--line)}
.mut{color:var(--mut);font-size:12px}.m5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.m5 input{padding:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}
.good{color:var(--acc2)}.badc{color:var(--bad)}
.note{background:var(--panel2);border-left:3px solid var(--warn);padding:12px 14px;border-radius:8px;font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.rule{padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:14px;border:1px solid var(--line)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:10px;display:none;z-index:9;max-width:340px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}canvas{max-height:300px}
.bsw{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.bsw button{background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:9px 16px;border-radius:99px;font-weight:600;cursor:pointer;font-size:14px}.bsw button.on{background:var(--acc);border-color:var(--acc);color:#fff}.bsw small{font-weight:400;opacity:.8}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--acc2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.help{font-size:12px;color:var(--mut);margin:4px 0 10px;line-height:1.5}
.step{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;align-items:center;justify-content:center;font-size:13px;margin-right:8px;font-weight:700}
</style>
</head>
<body>
<aside>
  <div class="logo">Post<span>Pilot</span></div>
  <nav id="nav"></nav>
</aside>
<div style="flex:1;min-width:0">
<div class="mnav" id="mnav"></div>
<main id="app"></main>
</div>
<div id="toast"></div>

<script>
/* ============ STATE ============ */
const KEY='postpilot_v2';
const BR={
sf:{name:'Standard Forms',short:'Auto · Moto · PME',site:'https://www.standardforms.fr/',
 sector:"Imprimerie professionnelle : imprimés, goodies et fournitures personnalisés pour l'auto, la moto, la motoculture, les PME et les vétérinaires. Site en ligne (panier, compte client), livraison offerte, devis gratuit, aide à la personnalisation, fabriqué en France, prêt en 48 h",
 topics:"impression pour garages, concessions auto/moto, PME et vétérinaires, goodies, PLV, porte-cartes grises, actualité automobile et moto",
 audience:"Directeurs de concession, garagistes indépendants, chefs d'atelier, acheteurs/administratif, PME",
 tone:"LinkedIn : professionnel, expert, factuel, un fait ou un chiffre par post, CTA discret, vouvoiement. Facebook : chaleureux, concret, visuel, tutoiement possible, photos brutes d'atelier, prix ou usage concret",
 pillars:"LinkedIn : expertise 30%, preuve sociale 25%, réseau 20%, humain 15%, produit 5%, communauté 5%. Facebook : humain/coulisses 30%, produit/promo 25%, expertise 15%, preuve sociale 15%, communauté 10%, réseau 5%",
 pages:{linkedin:{start:51,goal:120},facebook:{start:13,goal:63}}},
immo:{name:'Standard Forms Immo',short:'Immobilier · Notariat',site:'https://standardformsimmo.fr/',
 sector:"Imprimerie professionnelle pour l'immobilier et le notariat : pochettes de dossiers de vente et mandats, cartes de visite, plaquettes, panneaux à vendre/vendu, signalétique vitrine, kakémonos",
 topics:"impression pour agences immobilières, mandataires et notaires, dossiers de vente, signalétique vitrine, panneaux à vendre, actualité immobilier et notariat",
 audience:"Directeurs d'agence et réseaux nationaux, mandataires indépendants, notaires et offices notariaux, administratif en agence",
 tone:"LinkedIn : feutré et rigoureux, vouvoiement, un fait ou une obligation par post, CTA discret. Facebook : concret et chaleureux mais toujours professionnel (audience B2B), peu de familiarité",
 pillars:"Produit (dossiers, signalétique), expertise/rigueur, cas d'usage avant/après, coulisses d'atelier, engagement (question ouverte), institutionnel (sérieux, discrétion, 40 ans)",
 pages:{linkedin:{start:15,goal:150},facebook:{start:0,goal:100}}}};
const DEF={settings:{apiKey:'',model:'claude-sonnet-5-5'},cur:'sf',posts:[],fol:[],rev:{sf:3,immo:0},prof:{},learn:{},trends:{}};
function norm(d){d=d||{};const x=structuredClone(DEF);return{...x,...d,settings:{...x.settings,...(d.settings||{})},posts:d.posts||[],fol:d.fol||[],rev:{...x.rev,...(d.rev||{})},prof:d.prof||{},learn:d.learn||{},trends:d.trends||{},cur:BR[d.cur]?d.cur:'sf'}}
let S=load();
const bOf=p=>p.brand||'sf';
const brandPosts=()=>S.posts.filter(p=>bOf(p)===S.cur);
const BP=b=>({...BR[b],...(S.prof[b]||{})});const B=()=>BP(S.cur);
const siteOf=p=>BP(bOf(p)).site;
const L=()=>S.learn[S.cur]||(S.learn[S.cur]={rules:[],summary:'',count:0,at:null});
const PLN={linkedin:'LinkedIn',facebook:'Facebook'};
function curFol(b,pl){const h=S.fol.filter(f=>f.brand===b&&f.platform===pl).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.at-y.at);return h.length?h[h.length-1].n:BR[b].pages[pl].start}
function setBrand(k){S.cur=k;save();render()}
function setProf(b,k,v){S.prof[b]={...(S.prof[b]||{}),[k]:v.trim()};save()}let tab='dashboard';let period=30;let charts={};
function load(){try{return norm(JSON.parse(localStorage.getItem(KEY)))}catch{return structuredClone(DEF)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
const fmt=n=>n==null?'–':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1});

/* ============ METRICS ============ */
const inter=p=>(+p.m?.likes||0)+(+p.m?.comments||0)+(+p.m?.shares||0);
const er=p=>p.m?.impressions>0?inter(p)/p.m.impressions*100:null;
const ctr=p=>p.m?.impressions>0?(+p.m.clicks||0)/p.m.impressions*100:null;
const measured=()=>brandPosts().filter(p=>p.status==='published'&&p.m?.impressions>0);
function feats(t){return{q:/\?/.test(t),emoji:/\p{Extended_Pictographic}/u.test(t),list:/^\s*([-•→✅▪️]|\d+[.)])/m.test(t),num:/\d/.test(t),tags:/#\w+/.test(t),long:t.length>900,short:t.length<400}}
const FL={q:'Contient une question',emoji:'Contient des emojis',list:'Format liste',num:'Contient des chiffres',tags:'Contient des hashtags',long:'Post long (>900 car.)',short:'Post court (<400 car.)'};
function insights(){
  const M=measured();if(M.length<4)return[];
  const out=[];
  for(const k in FL){
    const w=M.filter(p=>feats(p.text)[k]),wo=M.filter(p=>!feats(p.text)[k]);
    if(w.length<2||wo.length<2)continue;
    const a=w.reduce((s,p)=>s+er(p),0)/w.length,b=wo.reduce((s,p)=>s+er(p),0)/wo.length;
    out.push({k,label:FL[k],with:a,without:b,diff:b?((a-b)/b*100):0,n:[w.length,wo.length]});
  }
  return out.sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff));
}

/* ============ CLAUDE API ============ */
async function claude(system,user,max=3000){
  if(!S.settings.apiKey)throw new Error('Ajoute ta clé API Anthropic dans Réglages.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.model,max_tokens:max,system,messages:[{role:'user',content:user}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erreur '+r.status));
  return j.content.map(c=>c.text||'').join('');
}
function parseJSON(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw new Error('Réponse IA invalide');return JSON.parse(t.slice(a,b+1))}
const pDesc=p=>`[${p.platform}] ER ${fmt(er(p))}% | CTR ${fmt(ctr(p))}% | ${p.m.impressions} impr, ${p.m.likes} likes, ${p.m.comments} com., ${p.m.shares} partages, ${p.m.clicks} clics\n"""${p.text}"""`;
function perfContext(){
  const M=measured().sort((a,b)=>er(b)-er(a));
  let c='';
  if(L().rules.length)c+='RÈGLES APPRISES (à appliquer en priorité):\n'+L().rules.map((l,i)=>`${i+1}. ${l}`).join('\n')+'\n\n';
  if(M.length){c+='MEILLEURS POSTS:\n'+M.slice(0,3).map(pDesc).join('\n---\n')+'\n\n';if(M.length>3)c+='PIRES POSTS (à éviter de reproduire):\n'+M.slice(-2).map(pDesc).join('\n---\n')+'\n\n'}
  const ins=insights().slice(0,4);if(ins.length)c+='CORRÉLATIONS:\n'+ins.map(i=>`- ${i.label}: ${fmt(i.with)}% vs ${fmt(i.without)}% sans (${i.diff>0?'+':''}${fmt(i.diff)}%)`).join('\n');
  return c||'Aucune donnée de performance pour le moment: explore des angles variés pour apprendre vite.';
}
const IMGR=`Pour chaque post, ajoute le champ "image" : une suggestion concrète de visuel pour l'illustrer (type de visuel, sujet précis, cadrage, ambiance, texte éventuel à incruster). Évite les photos de stock génériques ; privilégie une photo authentique, un visuel chiffré ou un carrousel quand c'est pertinent. Décris en 1 à 2 phrases.`;
const SYS=()=>`Tu es un expert en copywriting social media B2B/B2C francophone. Tu écris des posts qui génèrent du commentaire, du partage et du clic.
Marque: ${B().name}. Secteur: ${B().sector}. Audience: ${B().audience}. Ton: ${B().tone}. Piliers de contenu à respecter: ${B().pillars}.
Règles: accroche forte dans la 1re ligne (avant le "voir plus"), phrases courtes, aérées, une idée par post, une question ou un appel à commenter en fin de post, aucune promesse mensongère, aucun chiffre inventé présenté comme un fait. LinkedIn: 600-1300 caractères, 0-3 emojis max, 3-5 hashtags en fin. Facebook: plus court (200-500 caractères), plus conversationnel, emojis bienvenus, pas de bloc de hashtags. Si un lien est pertinent, place exactement {{LINK}} là où il doit apparaître (il sera remplacé par un lien tracké).
Réponds UNIQUEMENT avec un JSON valide.`;

async function generate(){
  const topic=$('#topic').value.trim(),plat=$('#plat').value,n=+$('#n').value,goal=$('#goal').value;
  if(!topic)return toast('Indique un sujet ou une idée.');
  const btn=$('#gen');btn.disabled=true;btn.textContent='Génération…';
  try{
    const plats=plat==='both'?['linkedin','facebook']:[plat];
    const user=`${perfContext()}\n\nMISSION: écris ${n} variante(s) par plateforme (${plats.join(', ')}) sur ce sujet: "${topic}". Objectif principal: ${goal}. Chaque variante doit utiliser un ANGLE différent (ex: storytelling, question clivante, liste, retour d'expérience, mythe vs réalité) pour tester ce qui marche. Applique les règles apprises. ${IMGR}\nFormat: {"posts":[{"platform":"linkedin|facebook","angle":"...","text":"...","image":"..."}]}`;
    const out=parseJSON(await claude(SYS(),user,4000));
    (out.posts||[]).forEach(p=>S.posts.unshift({id:uid(),platform:p.platform==='facebook'?'facebook':'linkedin',angle:p.angle||'',text:p.text,image:p.image||'',topic,brand:S.cur,status:'draft',createdAt:new Date().toISOString(),m:{impressions:0,likes:0,comments:0,shares:0,clicks:0}}));
    save();toast(`${out.posts.length} posts générés ✔`);go('posts');
  }catch(e){toast('Erreur : '+e.message,6000)}
  btn.disabled=false;btn.textContent='Générer les posts';
}

function analyzeParts(M){
  const user=`Voici les résultats de mes posts (ER = taux d'engagement, CTR = taux de clic):\n\n${M.map(pDesc).join('\n---\n')}\n\nCorrélations calculées:\n${insights().map(i=>`- ${i.label}: ${fmt(i.with)}% vs ${fmt(i.without)}%`).join('\n')}\n\nAnciennes règles:\n${L().rules.join('\n')||'aucune'}\n\nMission: analyse ce qui fonctionne et ce qui échoue, et produis 5 à 8 règles d'écriture concrètes, actionnables et priorisées pour mes prochains posts (accroches, longueur, format, CTA, sujets, différences LinkedIn/Facebook). Fusionne/corrige les anciennes règles. Reste prudent si l'échantillon est petit.\nFormat: {"rules":["..."],"summary":"2 phrases"}`;
  return['Tu es un analyste de performance social media. Réponds uniquement en JSON valide.',user]}
function applyLearn(o,M){L().rules=o.rules||[];L().summary=o.summary||'';L().count=M.length;L().at=new Date().toISOString();save()}
async function analyze(auto){
  const M=measured();if(M.length<3){if(!auto)toast('Il faut au moins 3 posts publiés avec des résultats.');return}
  if(!S.settings.apiKey){toast(auto?'3 nouveaux posts mesurés : mets à jour les règles dans Apprentissage (mode sans clé).':'Pas de clé API : utilise le mode sans clé ci-dessous.',6000);return}
  try{
    const [sys,user]=analyzeParts(M);
    const o=parseJSON(await claude(sys,user,2000));
    applyLearn(o,M);
    toast('Apprentissage mis à jour ✔');if(tab==='learn')render();
  }catch(e){toast('Analyse impossible : '+e.message,6000)}
}

/* ============ ACTIONS ============ */
function linkFor(p){
  if(!siteOf(p))return '';
  try{const u=new URL(siteOf(p));u.searchParams.set('utm_source',p.platform);u.searchParams.set('utm_medium','social');u.searchParams.set('utm_campaign','pp_'+p.id);return u.toString()}catch{return siteOf(p)}
}
const finalText=p=>p.text.replaceAll('{{LINK}}',linkFor(p));
async function copyPost(id){const p=S.posts.find(x=>x.id===id);await navigator.clipboard.writeText(finalText(p));toast('Copié ✔ (lien UTM inclus)')}
function openNet(id){const p=S.posts.find(x=>x.id===id);copyPost(id);
  window.open(p.platform==='linkedin'?'https://www.linkedin.com/feed/?shareActive=true&text='+encodeURIComponent(finalText(p)):'https://www.facebook.com/','_blank')}
function publish(id){const p=S.posts.find(x=>x.id===id);p.status='published';p.publishedAt=new Date().toISOString();save();render();toast('Marqué comme publié. Reviens saisir les résultats dans 48h.')}
function delPost(id){if(!confirm('Supprimer ce post ?'))return;S.posts=S.posts.filter(p=>p.id!==id);save();render()}
function saveMetrics(id){
  const p=S.posts.find(x=>x.id===id);
  p.m={impressions:+$('#i_'+id).value||0,likes:+$('#l_'+id).value||0,comments:+$('#c_'+id).value||0,shares:+$('#s_'+id).value||0,clicks:+$('#k_'+id).value||0};
  save();render();toast('Résultats enregistrés ✔');
  const n=measured().length;if(n>=3&&n-L().count>=3)analyze(true); // auto-ajustement tous les 3 nouveaux posts mesurés
}
function editImg(id){const p=S.posts.find(x=>x.id===id);p.image=$('#img_'+id).value;save();toast('Suggestion d\'image enregistrée ✔')}
function editText(id){const p=S.posts.find(x=>x.id===id);p.text=$('#t_'+id).value;save();toast('Texte modifié ✔')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='postpilot-backup.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S=norm(d);save();render();toast('Import réussi ✔')}catch{toast('Fichier invalide')}};r.readAsText(f)}
function reset(){if(confirm('Effacer TOUTES les données ?')){S=structuredClone(DEF);save();render()}}

/* ============ VIEWS ============ */
const TABS=[['dashboard','📊 Dashboard'],['input','✍️ Saisie'],['generate','✨ Générer'],['trends','🔥 Tendances'],['posts','📝 Mes posts'],['learn','🧠 Apprentissage'],['settings','⚙️ Réglages']];
function go(t){tab=t;render()}
function render(){
  const nav=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('#nav').innerHTML=nav;$('#mnav').innerHTML=TABS.map(([k,l])=>`<button onclick="go('${k}')">${l}</button>`).join('');
  Object.values(charts).forEach(c=>c.destroy());charts={};
  $('#app').innerHTML=brandBar()+({dashboard:vDash,input:vInput,generate:vGen,trends:vTrends,posts:vPosts,learn:vLearn,settings:vSet})[tab]();
  if(tab==='dashboard')drawCharts();
}
function vDash(){
  const since=period?Date.now()-period*864e5:0;
  const P=measured().filter(p=>new Date(p.publishedAt)>=since);
  const sum=k=>P.reduce((s,p)=>s+(+p.m[k]||0),0);
  const imp=sum('impressions'),it=P.reduce((s,p)=>s+inter(p),0),cl=sum('clicks');
  const top=[...P].sort((a,b)=>er(b)-er(a)).slice(0,6);
  return`<h1>Dashboard · ${B().name}</h1><p class="sub">Objectifs à 90 jours et performance de tes publications</p>${vGoals()}
  <div class="row" style="margin-bottom:16px">${[[7,'7 jours'],[30,'30 jours'],[90,'90 jours'],[0,'Tout']].map(([v,l])=>`<button class="btn sm ${period===v?'':'sec'}" onclick="period=${v};render()">${l}</button>`).join('')}</div>
  ${!P.length?`<div class="card empty">Aucun résultat sur cette période.<br><br>Saisis tes posts publiés et leurs résultats pour voir les graphiques.<br><br><button class="btn" onclick="go('input')">✍️ Saisir mes données</button></div>`:`
  <div class="grid kpis">
   <div class="card kpi"><div class="l">Posts mesurés</div><div class="v">${P.length}</div></div>
   <div class="card kpi"><div class="l">Impressions</div><div class="v">${fmt(imp)}</div></div>
   <div class="card kpi"><div class="l">Interactions</div><div class="v">${fmt(it)}</div></div>
   <div class="card kpi"><div class="l">Taux d'engagement</div><div class="v good">${fmt(imp?it/imp*100:0)}%</div></div>
   <div class="card kpi"><div class="l">Clics vers le site</div><div class="v">${fmt(cl)}</div></div>
   <div class="card kpi"><div class="l">CTR</div><div class="v good">${fmt(imp?cl/imp*100:0)}%</div></div>
  </div>

async function claudeWeb(system,user,max=6000){
  if(!S.settings.apiKey)throw new Error('Ajoute ta clé API Anthropic dans Réglages.');
  let msgs=[{role:'user',content:user}],txt='';
  for(let i=0;i<4;i++){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.model,max_tokens:max,system,tools:[{type:'web_search_20250305',name:'web_search',max_uses:6}],messages:msgs})});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erreur '+r.status));
    txt+=j.content.filter(c=>c.type==='text').map(c=>c.text).join('');
    if(j.stop_reason!=='pause_turn')break;
    msgs=[...msgs,{role:'assistant',content:j.content}];
  }
  return txt}

function trendsParts(){const b=B();const today=new Date().toLocaleDateString('fr-FR');
    const sys=`Tu es stratège social media pour ${b.name} (${b.sector}). Audience: ${b.audience}. Ton: ${b.tone}. Piliers: ${b.pillars}. Tu DOIS t'appuyer sur la recherche web pour identifier ce qui performe actuellement (nous sommes le ${today}). N'invente ni chiffre ni source : si tu ne trouves pas, dis-le. Réponds UNIQUEMENT avec un JSON valide.`;
    const user=`${perfContext()}\n\nRecherche les tendances, formats, accroches et sujets d'actualité qui fonctionnent en ce moment sur LinkedIn et Facebook pour : ${b.topics}. Regarde aussi ce que publient les acteurs de référence du secteur. Produis 4 tendances (title, insight, source = URL réelle trouvée) puis 6 posts prêts à publier (3 LinkedIn, 3 Facebook) qui appliquent ces tendances et les piliers de la marque ; "why" = pourquoi ça devrait marcher. Utilise {{LINK}} pour le lien du site si pertinent. ${IMGR}\nFormat: {"trends":[{"title":"","insight":"","source":""}],"posts":[{"platform":"linkedin|facebook","pillar":"","angle":"","text":"","image":"","why":""}]}`;
    return[sys,user]}
function genParts(topic,plat,n,goal){const plats=plat==='both'?['linkedin','facebook']:[plat];const user=`${perfContext()}\n\nMISSION: écris ${n} variante(s) par plateforme (${plats.join(', ')}) sur ce sujet: "${topic}". Objectif principal: ${goal}. Chaque variante doit utiliser un ANGLE différent (ex: storytelling, question clivante, liste, retour d'expérience, mythe vs réalité) pour tester ce qui marche. Applique les règles apprises. ${IMGR}\nFormat: {"posts":[{"platform":"linkedin|facebook","angle":"...","text":"...","image":"..."}]}`;
  return[SYS(),user]}
const noKey=k=>`<div class="card" style="margin:14px 0"><b>Mode sans clé API</b> <span class="mut">(avec ton abonnement Claude.ai)</span>
<div class="help"><b>1.</b> ${k==='gen'?'Remplis le sujet ci-dessus, puis clique':'Clique'} sur « Copier le prompt ». <b>2.</b> Colle-le dans une conversation Claude.ai${k==='trends'?' <b>avec la recherche web activée</b>':''}. <b>3.</b> Copie la réponse de Claude et colle-la ci-dessous.</div>
<button class="btn sec" onclick="copyPrompt('${k}')">📋 Copier le prompt</button>
<label>Réponse de Claude</label><textarea id="paste_${k}" placeholder="Colle ici la réponse de Claude (le JSON)…"></textarea>
<div style="margin-top:10px"><button class="btn" onclick="importReply('${k}')">📥 ${k==='gen'?'Créer les brouillons':k==='learn'?'Appliquer les règles':'Importer les suggestions'}</button></div></div>`;
async function copyPrompt(k){
  let p;
  if(k==='gen'){const topic=$('#topic').value.trim();if(!topic)return toast('Indique d\'abord un sujet.');p=genParts(topic,$('#plat').value,+$('#n').value,$('#goal').value).join('\n\n')}
  else if(k==='learn'){const M=measured();if(M.length<3)return toast('Il faut au moins 3 posts publiés avec des résultats.');p=analyzeParts(M).join('\n\n')}
  else p=trendsParts().join('\n\n')+'\n\n(Utilise la recherche web dans cette conversation.)';
  try{await navigator.clipboard.writeText(p+'\n\nRéponds uniquement avec le JSON, dans un seul bloc de code, sans autre texte.');toast('Prompt copié ✔ Colle-le dans Claude.ai',5000)}catch{toast('Copie impossible : autorise le presse-papiers.')}}
function importReply(k){
  const v=$('#paste_'+k).value.trim();if(!v)return toast('Colle d\'abord la réponse de Claude.');
  try{
    const o=parseJSON(v);
    if(k==='gen'){
      const arr=(o.posts||[]).filter(p=>p.text);if(!arr.length)throw 0;
      const topic=$('#topic')?$('#topic').value.trim():'';
      arr.forEach(p=>S.posts.unshift({id:uid(),brand:S.cur,platform:p.platform==='facebook'?'facebook':'linkedin',angle:p.angle||'',text:p.text,image:p.image||'',topic,status:'draft',createdAt:new Date().toISOString(),m:{impressions:0,likes:0,comments:0,shares:0,clicks:0}}));
      save();toast(arr.length+' brouillons créés ✔');go('posts');
    }else if(k==='learn'){
      const r=(o.rules||[]).filter(x=>typeof x==='string'&&x.trim());if(!r.length)throw 0;
      applyLearn({rules:r,summary:o.summary},measured());render();toast(r.length+' règles appliquées ✔');
    }else{
      if(!(o.posts||[]).length&&!(o.trends||[]).length)throw 0;
      S.trends[S.cur]={at:new Date().toISOString(),trends:o.trends||[],posts:o.posts||[]};save();render();toast('Suggestions importées ✔');
    }
  }catch{toast('Réponse illisible : demande à Claude de renvoyer uniquement le JSON.',6000)}}

render();
</script>
</body>
</html>
