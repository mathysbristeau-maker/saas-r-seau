<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostPilot – Posts LinkedIn & Facebook auto-optimisés</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--panel2:#1f2440;--line:#2a3052;--txt:#e8ebff;--mut:#8b93c0;--acc:#6c7bff;--acc2:#38d9a9;--warn:#ffb84d;--bad:#ff6b81;--li:#0a66c2;--fb:#1877f2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--txt);display:flex;min-height:100vh}
aside{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;font-size:20px;margin:0 8px 24px}.logo span{color:var(--acc)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:4px}
nav button:hover{background:var(--panel2);color:var(--txt)}nav button.on{background:var(--acc);color:#fff}
main{flex:1;padding:28px;max-width:1200px;min-width:0}
h1{margin:0 0 4px;font-size:24px}.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.kpi .v{font-size:28px;font-weight:700;margin-top:6px}
.two{grid-template-columns:2fr 1fr}@media(max-width:900px){.two{grid-template-columns:1fr}aside{display:none}body{display:block}.mnav{display:flex!important}}
.mnav{display:none;gap:6px;overflow:auto;padding:10px;background:var(--panel);position:sticky;top:0;z-index:5}.mnav button{background:var(--panel2);border:0;color:var(--txt);padding:8px 12px;border-radius:8px;white-space:nowrap}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.btn{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:wait}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:12px}.btn.ok{background:var(--acc2);color:#04241b}.btn.del{background:none;color:var(--bad);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.f1{flex:1!important}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700}.tag.li{background:var(--li)}.tag.fb{background:var(--fb)}.tag.draft{background:var(--panel2);color:var(--mut)}.tag.pub{background:var(--acc2);color:#04241b}
.post{margin-bottom:14px}.post pre{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.55;margin:12px 0;background:var(--bg);padding:14px;border-radius:10px;border:1px solid var(--line)}
.mut{color:var(--mut);font-size:12px}.m5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.m5 input{padding:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}
.good{color:var(--acc2)}.badc{color:var(--bad)}
.note{background:var(--panel2);border-left:3px solid var(--warn);padding:12px 14px;border-radius:8px;font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.rule{padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:14px;border:1px solid var(--line)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:10px;display:none;z-index:9;max-width:340px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}canvas{max-height:300px}
</style>
</head>
<body>
<aside>
  <div class="logo">Post<span>Pilot</span></div>
  <nav id="nav"></nav>
</aside>
<div style="flex:1;min-width:0">
<div class="mnav" id="mnav"></div>
<main id="app"></main>
</div>
<div id="toast"></div>

<script>
/* ============ STATE ============ */
const KEY='postpilot_v1';
const DEF={settings:{apiKey:'',model:'claude-sonnet-5-5',brand:'',sector:'',audience:'',tone:'Professionnel mais humain, direct, sans jargon',siteUrl:'',learnings:[],lastAnalysisCount:0,lastAnalysisAt:null},posts:[]};
let S=load();let tab='dashboard';let period=30;let charts={};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d?{settings:{...DEF.settings,...d.settings},posts:d.posts||[]}:structuredClone(DEF)}catch{return structuredClone(DEF)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms)}
const fmt=n=>n==null?'–':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1});

/* ============ METRICS ============ */
const inter=p=>(+p.m?.likes||0)+(+p.m?.comments||0)+(+p.m?.shares||0);
const er=p=>p.m?.impressions>0?inter(p)/p.m.impressions*100:null;
const ctr=p=>p.m?.impressions>0?(+p.m.clicks||0)/p.m.impressions*100:null;
const measured=()=>S.posts.filter(p=>p.status==='published'&&p.m?.impressions>0);
function feats(t){return{q:/\?/.test(t),emoji:/\p{Extended_Pictographic}/u.test(t),list:/^\s*([-•→✅▪️]|\d+[.)])/m.test(t),num:/\d/.test(t),tags:/#\w+/.test(t),long:t.length>900,short:t.length<400}}
const FL={q:'Contient une question',emoji:'Contient des emojis',list:'Format liste',num:'Contient des chiffres',tags:'Contient des hashtags',long:'Post long (>900 car.)',short:'Post court (<400 car.)'};
function insights(){
  const M=measured();if(M.length<4)return[];
  const out=[];
  for(const k in FL){
    const w=M.filter(p=>feats(p.text)[k]),wo=M.filter(p=>!feats(p.text)[k]);
    if(w.length<2||wo.length<2)continue;
    const a=w.reduce((s,p)=>s+er(p),0)/w.length,b=wo.reduce((s,p)=>s+er(p),0)/wo.length;
    out.push({k,label:FL[k],with:a,without:b,diff:b?((a-b)/b*100):0,n:[w.length,wo.length]});
  }
  return out.sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff));
}

/* ============ CLAUDE API ============ */
async function claude(system,user,max=3000){
  if(!S.settings.apiKey)throw new Error('Ajoute ta clé API Anthropic dans Réglages.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.model,max_tokens:max,system,messages:[{role:'user',content:user}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erreur '+r.status));
  return j.content.map(c=>c.text||'').join('');
}
function parseJSON(t){const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<0)throw new Error('Réponse IA invalide');return JSON.parse(t.slice(a,b+1))}
const pDesc=p=>`[${p.platform}] ER ${fmt(er(p))}% | CTR ${fmt(ctr(p))}% | ${p.m.impressions} impr, ${p.m.likes} likes, ${p.m.comments} com., ${p.m.shares} partages, ${p.m.clicks} clics\n"""${p.text}"""`;
function perfContext(){
  const M=measured().sort((a,b)=>er(b)-er(a));
  let c='';
  if(S.settings.learnings.length)c+='RÈGLES APPRISES (à appliquer en priorité):\n'+S.settings.learnings.map((l,i)=>`${i+1}. ${l}`).join('\n')+'\n\n';
  if(M.length){c+='MEILLEURS POSTS:\n'+M.slice(0,3).map(pDesc).join('\n---\n')+'\n\n';if(M.length>3)c+='PIRES POSTS (à éviter de reproduire):\n'+M.slice(-2).map(pDesc).join('\n---\n')+'\n\n'}
  const ins=insights().slice(0,4);if(ins.length)c+='CORRÉLATIONS:\n'+ins.map(i=>`- ${i.label}: ${fmt(i.with)}% vs ${fmt(i.without)}% sans (${i.diff>0?'+':''}${fmt(i.diff)}%)`).join('\n');
  return c||'Aucune donnée de performance pour le moment: explore des angles variés pour apprendre vite.';
}
const SYS=()=>`Tu es un expert en copywriting social media B2B/B2C francophone. Tu écris des posts qui génèrent du commentaire, du partage et du clic.
Marque: ${S.settings.brand||'non précisée'}. Secteur: ${S.settings.sector||'non précisé'}. Audience: ${S.settings.audience||'non précisée'}. Ton: ${S.settings.tone}.
Règles: accroche forte dans la 1re ligne (avant le "voir plus"), phrases courtes, aérées, une idée par post, une question ou un appel à commenter en fin de post, aucune promesse mensongère, aucun chiffre inventé présenté comme un fait. LinkedIn: 600-1300 caractères, 0-3 emojis max, 3-5 hashtags en fin. Facebook: plus court (200-500 caractères), plus conversationnel, emojis bienvenus, pas de bloc de hashtags. Si un lien est pertinent, place exactement {{LINK}} là où il doit apparaître (il sera remplacé par un lien tracké).
Réponds UNIQUEMENT avec un JSON valide.`;

async function generate(){
  const topic=$('#topic').value.trim(),plat=$('#plat').value,n=+$('#n').value,goal=$('#goal').value;
  if(!topic)return toast('Indique un sujet ou une idée.');
  const btn=$('#gen');btn.disabled=true;btn.textContent='Génération…';
  try{
    const plats=plat==='both'?['linkedin','facebook']:[plat];
    const user=`${perfContext()}\n\nMISSION: écris ${n} variante(s) par plateforme (${plats.join(', ')}) sur ce sujet: "${topic}". Objectif principal: ${goal}. Chaque variante doit utiliser un ANGLE différent (ex: storytelling, question clivante, liste, retour d'expérience, mythe vs réalité) pour tester ce qui marche. Applique les règles apprises.\nFormat: {"posts":[{"platform":"linkedin|facebook","angle":"...","text":"..."}]}`;
    const out=parseJSON(await claude(SYS(),user,4000));
    (out.posts||[]).forEach(p=>S.posts.unshift({id:uid(),platform:p.platform==='facebook'?'facebook':'linkedin',angle:p.angle||'',text:p.text,topic,status:'draft',createdAt:new Date().toISOString(),m:{impressions:0,likes:0,comments:0,shares:0,clicks:0}}));
    save();toast(`${out.posts.length} posts générés ✔`);go('posts');
  }catch(e){toast('Erreur : '+e.message,6000)}
  btn.disabled=false;btn.textContent='Générer les posts';
}

async function analyze(auto){
  const M=measured();if(M.length<3){if(!auto)toast('Il faut au moins 3 posts publiés avec des résultats.');return}
  try{
    const user=`Voici les résultats de mes posts (ER = taux d'engagement, CTR = taux de clic):\n\n${M.map(pDesc).join('\n---\n')}\n\nCorrélations calculées:\n${insights().map(i=>`- ${i.label}: ${fmt(i.with)}% vs ${fmt(i.without)}%`).join('\n')}\n\nAnciennes règles:\n${S.settings.learnings.join('\n')||'aucune'}\n\nMission: analyse ce qui fonctionne et ce qui échoue, et produis 5 à 8 règles d'écriture concrètes, actionnables et priorisées pour mes prochains posts (accroches, longueur, format, CTA, sujets, différences LinkedIn/Facebook). Fusionne/corrige les anciennes règles. Reste prudent si l'échantillon est petit.\nFormat: {"rules":["..."],"summary":"2 phrases"}`;
    const o=parseJSON(await claude('Tu es un analyste de performance social media. Réponds uniquement en JSON valide.',user,2000));
    S.settings.learnings=o.rules||[];S.settings.summary=o.summary||'';S.settings.lastAnalysisCount=M.length;S.settings.lastAnalysisAt=new Date().toISOString();save();
    toast('Apprentissage mis à jour ✔');if(tab==='learn')render();
  }catch(e){toast('Analyse impossible : '+e.message,6000)}
}

/* ============ ACTIONS ============ */
function linkFor(p){
  if(!S.settings.siteUrl)return '';
  try{const u=new URL(S.settings.siteUrl);u.searchParams.set('utm_source',p.platform);u.searchParams.set('utm_medium','social');u.searchParams.set('utm_campaign','pp_'+p.id);return u.toString()}catch{return S.settings.siteUrl}
}
const finalText=p=>p.text.replaceAll('{{LINK}}',linkFor(p));
async function copyPost(id){const p=S.posts.find(x=>x.id===id);await navigator.clipboard.writeText(finalText(p));toast('Copié ✔ (lien UTM inclus)')}
function openNet(id){const p=S.posts.find(x=>x.id===id);copyPost(id);
  window.open(p.platform==='linkedin'?'https://www.linkedin.com/feed/?shareActive=true&text='+encodeURIComponent(finalText(p)):'https://www.facebook.com/','_blank')}
function publish(id){const p=S.posts.find(x=>x.id===id);p.status='published';p.publishedAt=new Date().toISOString();save();render();toast('Marqué comme publié. Reviens saisir les résultats dans 48h.')}
function delPost(id){if(!confirm('Supprimer ce post ?'))return;S.posts=S.posts.filter(p=>p.id!==id);save();render()}
function saveMetrics(id){
  const p=S.posts.find(x=>x.id===id);
  p.m={impressions:+$('#i_'+id).value||0,likes:+$('#l_'+id).value||0,comments:+$('#c_'+id).value||0,shares:+$('#s_'+id).value||0,clicks:+$('#k_'+id).value||0};
  save();render();toast('Résultats enregistrés ✔');
  const n=measured().length;if(n>=3&&n-S.settings.lastAnalysisCount>=3)analyze(true); // auto-ajustement tous les 3 nouveaux posts mesurés
}
function editText(id){const p=S.posts.find(x=>x.id===id);p.text=$('#t_'+id).value;save();toast('Texte modifié ✔')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='postpilot-backup.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);S={settings:{...DEF.settings,...d.settings},posts:d.posts||[]};save();render();toast('Import réussi ✔')}catch{toast('Fichier invalide')}};r.readAsText(f)}
function demo(){
  const T=['Hier un client m\'a dit : « je perds 5h par semaine sur mes posts ». Voici ce qu\'on a changé 👇\n\n- Un sujet par post\n- Une question à la fin\n- 3 hashtags max\n\nEt vous, combien de temps y passez-vous ?','Les 3 erreurs qui tuent votre portée sur LinkedIn.\n\n1. Accroche molle\n2. Mur de texte\n3. Aucun appel à commenter\n\nLaquelle faites-vous encore ?','Nouveau sur notre blog : comment automatiser son reporting. Lien : {{LINK}}','Mythe : « il faut poster tous les jours ». Réalité : mieux vaut 3 posts forts que 7 posts moyens. Votre avis ?','Notre équipe grandit ! Bienvenue à Sarah 🎉','Cas client : -40% de temps de prod grâce à l\'IA. Détails en commentaire.','Astuce du jour : relisez votre 1re ligne. Donne-t-elle envie de cliquer sur « voir plus » ?','On vous partage nos résultats du mois 📈 Lien : {{LINK}}'];
  T.forEach((t,i)=>{const d=new Date(Date.now()-(T.length-i)*3*864e5).toISOString();const imp=Math.round(800+Math.random()*3500);
    S.posts.push({id:uid(),platform:i%3===2?'facebook':'linkedin',angle:'démo',text:t,topic:'démo',status:'published',createdAt:d,publishedAt:d,m:{impressions:imp,likes:Math.round(imp*(/\?/.test(t)?.05:.02)),comments:Math.round(imp*(/\?/.test(t)?.012:.003)),shares:Math.round(imp*.004),clicks:Math.round(imp*(/LINK/.test(t)?.025:.008))}})});
  save();render();toast('Données de démo ajoutées');
}
function reset(){if(confirm('Effacer TOUTES les données ?')){S=structuredClone(DEF);save();render()}}

/* ============ VIEWS ============ */
const TABS=[['dashboard','📊 Dashboard'],['generate','✨ Générer'],['posts','📝 Mes posts'],['learn','🧠 Apprentissage'],['settings','⚙️ Réglages']];
function go(t){tab=t;render()}
function render(){
  const nav=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('#nav').innerHTML=nav;$('#mnav').innerHTML=TABS.map(([k,l])=>`<button onclick="go('${k}')">${l}</button>`).join('');
  Object.values(charts).forEach(c=>c.destroy());charts={};
  $('#app').innerHTML=({dashboard:vDash,generate:vGen,posts:vPosts,learn:vLearn,settings:vSet})[tab]();
  if(tab==='dashboard')drawCharts();
}
function vDash(){
  const since=period?Date.now()-period*864e5:0;
  const P=measured().filter(p=>new Date(p.publishedAt)>=since);
  const sum=k=>P.reduce((s,p)=>s+(+p.m[k]||0),0);
  const imp=sum('impressions'),it=P.reduce((s,p)=>s+inter(p),0),cl=sum('clicks');
  const top=[...P].sort((a,b)=>er(b)-er(a)).slice(0,6);
  return`<h1>Dashboard</h1><p class="sub">Performance de tes publications</p>
  <div class="row" style="margin-bottom:16px">${[[7,'7 jours'],[30,'30 jours'],[90,'90 jours'],[0,'Tout']].map(([v,l])=>`<button class="btn sm ${period===v?'':'sec'}" onclick="period=${v};render()">${l}</button>`).join('')}</div>
  ${!P.length?`<div class="card empty">Aucun résultat sur cette période.<br><br>Génère des posts, publie-les, puis saisis leurs résultats.<br><br><button class="btn" onclick="demo()">Charger des données de démo</button></div>`:`
  <div class="grid kpis">
   <div class="card kpi"><div class="l">Posts mesurés</div><div class="v">${P.length}</div></div>
   <div class="card kpi"><div class="l">Impressions</div><div class="v">${fmt(imp)}</div></div>
   <div class="card kpi"><div class="l">Interactions</div><div class="v">${fmt(it)}</div></div>
   <div class="card kpi"><div class="l">Taux d'engagement</div><div class="v good">${fmt(imp?it/imp*100:0)}%</div></div>
   <div class="card kpi"><div class="l">Clics vers le site</div><div class="v">${fmt(cl)}</div></div>
   <div class="card kpi"><div class="l">CTR</div><div class="v good">${fmt(imp?cl/imp*100:0)}%</div></div>
  </div>
  <div class="grid two" style="margin-bottom:14px"><div class="card"><b>Évolution</b><canvas id="c1"></canvas></div><div class="card"><b>Interactions par réseau</b><canvas id="c2"></canvas></div></div>
  <div class="grid two" style="margin-bottom:14px"><div class="card"><b>Détail des interactions</b><canvas id="c3"></canvas></div><div class="card"><b>Clics par post</b><canvas id="c4"></canvas></div></div>
  <div class="card"><b>🏆 Top posts</b><table style="margin-top:10px"><tr><th>Réseau</th><th>Post</th><th>Impr.</th><th>Engag.</th><th>Clics</th><th>ER</th></tr>${top.map(p=>`<tr><td><span class="tag ${p.platform==='linkedin'?'li':'fb'}">${p.platform==='linkedin'?'LI':'FB'}</span></td><td>${esc(p.text.slice(0,70))}…</td><td>${fmt(p.m.impressions)}</td><td>${fmt(inter(p))}</td><td>${fmt(p.m.clicks)}</td><td class="good">${fmt(er(p))}%</td></tr>`).join('')}</table></div>`}`;
}
function drawCharts(){
  const since=period?Date.now()-period*864e5:0;
  const P=measured().filter(p=>new Date(p.publishedAt)>=since).sort((a,b)=>new Date(a.publishedAt)-new Date(b.publishedAt));
  if(!P.length)return;
  const css=getComputedStyle(document.body);Chart.defaults.color='#8b93c0';Chart.defaults.borderColor='#2a3052';
  const lab=P.map(p=>new Date(p.publishedAt).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}));
  charts.a=new Chart($('#c1'),{type:'line',data:{labels:lab,datasets:[{label:'Taux d\'engagement %',data:P.map(er),borderColor:'#6c7bff',tension:.3,yAxisID:'y'},{label:'CTR %',data:P.map(ctr),borderColor:'#38d9a9',tension:.3,yAxisID:'y'}]}});
  const by=pl=>P.filter(p=>p.platform===pl).reduce((s,p)=>s+inter(p),0);
  charts.b=new Chart($('#c2'),{type:'doughnut',data:{labels:['LinkedIn','Facebook'],datasets:[{data:[by('linkedin'),by('facebook')],backgroundColor:['#0a66c2','#1877f2'],borderWidth:0}]}});
  const s=k=>P.reduce((a,p)=>a+(+p.m[k]||0),0);
  charts.c=new Chart($('#c3'),{type:'bar',data:{labels:['Likes','Commentaires','Partages','Clics'],datasets:[{data:[s('likes'),s('comments'),s('shares'),s('clicks')],backgroundColor:['#6c7bff','#38d9a9','#ffb84d','#ff6b81']}]},options:{plugins:{legend:{display:false}}}});
  charts.d=new Chart($('#c4'),{type:'bar',data:{labels:lab,datasets:[{data:P.map(p=>+p.m.clicks||0),backgroundColor:'#38d9a9'}]},options:{plugins:{legend:{display:false}}}});
}
function vGen(){
  return`<h1>Générer des posts</h1><p class="sub">L'IA applique automatiquement ce qu'elle a appris de tes résultats (${S.settings.learnings.length} règles actives).</p>
  ${!S.settings.apiKey?`<div class="note">⚠️ Ajoute d'abord ta clé API Anthropic dans <a href="#" onclick="go('settings');return false" style="color:var(--acc)">Réglages</a>.</div>`:''}
  <div class="card"><label>Sujet / idée / actualité à communiquer</label><textarea id="topic" placeholder="Ex : nous lançons une offre d'audit gratuit pour les PME du secteur…"></textarea>
  <div class="row" style="margin-top:6px"><div class="f1"><label>Réseau</label><select id="plat"><option value="both">LinkedIn + Facebook</option><option value="linkedin">LinkedIn</option><option value="facebook">Facebook</option></select></div>
  <div class="f1"><label>Variantes par réseau</label><select id="n"><option>1</option><option selected>2</option><option>3</option></select></div>
  <div class="f1"><label>Objectif</label><select id="goal"><option>Maximiser les commentaires</option><option>Maximiser les clics vers le site</option><option>Maximiser les partages</option><option>Équilibre engagement + clics</option></select></div></div>
  <div style="margin-top:18px"><button class="btn" id="gen" onclick="generate()">Générer les posts</button></div></div>`;
}
function postCard(p){
  const li=p.platform==='linkedin',id=p.id,m=p.m||{};
  return`<div class="card post"><div class="row"><span class="tag ${li?'li':'fb'}">${li?'LinkedIn':'Facebook'}</span><span class="tag ${p.status==='published'?'pub':'draft'}">${p.status==='published'?'Publié':'Brouillon'}</span><span class="mut f1">${esc(p.angle)} · ${new Date(p.createdAt).toLocaleDateString('fr-FR')}</span>${p.m?.impressions>0?`<span class="good"><b>ER ${fmt(er(p))}%</b></span><span class="mut">CTR ${fmt(ctr(p))}%</span>`:''}</div>
  <textarea id="t_${id}" style="margin-top:12px;min-height:150px" onchange="editText('${id}')">${esc(p.text)}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn sm sec" onclick="copyPost('${id}')">📋 Copier</button><button class="btn sm sec" onclick="openNet('${id}')">↗ Copier & ouvrir ${li?'LinkedIn':'Facebook'}</button>${p.status!=='published'?`<button class="btn sm ok" onclick="publish('${id}')">✔ J'ai publié</button>`:''}<span class="f1"></span><button class="btn sm del" onclick="delPost('${id}')">Supprimer</button></div>
  ${p.status==='published'?`<details style="margin-top:12px" ${p.m?.impressions?'':'open'}><summary class="mut" style="cursor:pointer">📈 Saisir / modifier les résultats</summary>
  <div class="m5" style="margin-top:10px">${[['i','Impressions','impressions'],['l','Likes','likes'],['c','Commentaires','comments'],['s','Partages','shares'],['k','Clics site','clicks']].map(([a,l,k])=>`<div><label style="margin:0 0 4px">${l}</label><input type="number" min="0" id="${a}_${id}" value="${m[k]||0}"></div>`).join('')}</div>
  <div style="margin-top:10px"><button class="btn sm" onclick="saveMetrics('${id}')">Enregistrer</button></div></details>`:''}</div>`;
}
function vPosts(){
  return`<h1>Mes posts</h1><p class="sub">Brouillons et publications</p>${S.posts.length?S.posts.map(postCard).join(''):`<div class="card empty">Aucun post pour l'instant. <a href="#" onclick="go('generate');return false" style="color:var(--acc)">Génère-en →</a></div>`}`;
}
function vLearn(){
  const ins=insights(),n=measured().length;
  return`<h1>Apprentissage</h1><p class="sub">Comment l'IA s'ajuste en fonction de tes résultats</p>
  <div class="card" style="margin-bottom:14px"><div class="row"><div class="f1"><b>Règles apprises</b><div class="mut">${n} posts mesurés${S.settings.lastAnalysisAt?` · dernière analyse le ${new Date(S.settings.lastAnalysisAt).toLocaleDateString('fr-FR')}`:''} · analyse automatique tous les 3 nouveaux posts mesurés</div></div><button class="btn" onclick="analyze(false)">🔄 Analyser maintenant</button></div>
  ${S.settings.summary?`<p style="margin:14px 0">${esc(S.settings.summary)}</p>`:''}
  <div style="margin-top:14px">${S.settings.learnings.length?S.settings.learnings.map(r=>`<div class="rule">${esc(r)}</div>`).join(''):'<div class="mut">Pas encore de règles. Publie et mesure au moins 3 posts.</div>'}</div></div>
  <div class="card"><b>Corrélations observées (taux d'engagement)</b>${ins.length?`<table style="margin-top:10px"><tr><th>Critère</th><th>Avec</th><th>Sans</th><th>Écart</th></tr>${ins.map(i=>`<tr><td>${i.label}</td><td>${fmt(i.with)}% <span class="mut">(${i.n[0]})</span></td><td>${fmt(i.without)}% <span class="mut">(${i.n[1]})</span></td><td class="${i.diff>0?'good':'badc'}">${i.diff>0?'+':''}${fmt(i.diff)}%</td></tr>`).join('')}</table>`:'<div class="mut" style="margin-top:8px">Il faut au moins 4 posts mesurés.</div>'}</div>`;
}
function vSet(){
  const s=S.settings;
  const inp=(k,l,ph='',t='text')=>`<label>${l}</label><input type="${t}" value="${esc(s[k])}" placeholder="${ph}" onchange="S.settings['${k}']=this.value.trim();save()">`;
  return`<h1>Réglages</h1><p class="sub">Tout est stocké dans ton navigateur (localStorage).</p>
  <div class="note"><b>Sécurité :</b> ta clé API reste dans ton navigateur et n'est envoyée qu'à Anthropic. Ne partage pas ton ordinateur/profil avec des tiers. Pour un usage multi-clients, il faudra une version avec backend (voir plus bas).</div>
  <div class="card">${inp('apiKey','Clé API Anthropic','sk-ant-…','password')}${inp('model','Modèle','claude-sonnet-5-5')}
  ${inp('brand','Nom / marque & description','Ex : Agence Pixel, agence web spécialisée PME')}${inp('sector','Secteur')}${inp('audience','Audience cible','Ex : dirigeants de PME, 30-55 ans')}${inp('tone','Ton éditorial')}${inp('siteUrl','URL du site (pour le suivi des clics avec UTM)','https://monsite.fr')}</div>
  <div class="card" style="margin-top:14px"><b>Données</b><div class="row" style="margin-top:10px"><button class="btn sec" onclick="exportData()">⬇ Exporter (JSON)</button><label class="btn sec" style="margin:0;cursor:pointer">⬆ Importer<input type="file" accept=".json" hidden onchange="importData(event)"></label><button class="btn sec" onclick="demo()">Données de démo</button><button class="btn del" onclick="reset()">Tout effacer</button></div></div>
  <div class="card" style="margin-top:14px"><b>Comment sont mesurés les clics ?</b><p class="mut" style="line-height:1.6">Chaque post contenant {{LINK}} reçoit un lien avec des paramètres UTM uniques (<code>utm_campaign=pp_ID</code>). Tu retrouves ces clics dans Google Analytics / Plausible / les stats du réseau, puis tu les saisis dans la fiche du post.</p></div>`;
}
render();
</script>
</body>
</html>
