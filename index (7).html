<style>

*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--txt);display:flex;min-height:100vh}
aside{width:220px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:800;font-size:20px;margin:0 8px 24px}.logo span{color:var(--acc)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer;margin-bottom:4px}
nav button:hover{background:var(--panel2);color:var(--txt)}nav button.on{background:var(--acc);color:#fff}
main{flex:1;padding:28px;max-width:1200px;min-width:0}

.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}

textarea{min-height:120px;resize:vertical;line-height:1.5}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.f1{flex:1!important}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:700}.tag.li{background:var(--li)}.tag.fb{background:var(--fb)}.tag.draft{background:var(--panel2);color:var(--mut)}.tag.pub{background:var(--acc2);color:#04241b}

.mut{color:var(--mut);font-size:12px}.m5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.m5 input{padding:8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}

.note{background:var(--panel2);border-left:3px solid var(--warn);padding:12px 14px;border-radius:8px;font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.rule{padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-size:14px;border:1px solid var(--line)}
#toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:10px;display:none;z-index:9;max-width:340px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}canvas{max-height:300px}
.bsw{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.bsw button{background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:9px 16px;border-radius:99px;font-weight:600;cursor:pointer;font-size:14px}.bsw button.on{background:var(--acc);border-color:var(--acc);color:#fff}.bsw small{font-weight:400;opacity:.8}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--acc2)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}

.prow{padding:14px 18px;margin-bottom:10px}.prow summary{cursor:pointer;list-style:none}.prow summary::-webkit-details-marker{display:none}.prow[open]>summary{padding-bottom:4px}

const FB_HIST=[{"date":"2026-06-16","m":{"impressions":46,"likes":0,"comments":0,"shares":0,"clicks":1},"text":"Un client entre dans votre concession.\nEn quelques secondes, il regarde votre équipe.\nIl cherche qui lui parler. Il ne sait pas qui est vendeur, qui est technicien, qui est responsable.\n\nAlors il attend. Il hésite. Il repart parfois sans avoir osé aborder quelqu'un.\nCe client avait pourtant envie d'acheter.\nEt si un simple badge sur la chemise avait tout changé ?\nChez Standard Forms, nos badges d'identification aluminium et PVC sont conçus pour les professionnels qui soignent leur image autant que leur accueil. Entièrement personnalisés à votre logo, avec le nom et la fonction de chaque collaborateur, ils se fixent en un clic grâce à l'attache magnétique, sans abîmer les vêtements.\nUn détail qui fait toute la différence au moment où votre client franchit la porte.\nModèle PVC (réf. DM87PVC) à partir de 4,61 € HT l'unité\nModèle aluminium brossé (réf. DM87ALU) à partir de 17,99 € HT l'unité"},{"date":"2026-06-11","m":{"impressions":40,"likes":0,"comments":0,"shares":0,"clicks":0},"text":"Sur votre parc automobile, chaque véhicule exposé a une plaque d'immatriculation visible.\nUne plaque que n'importe qui peut photographier. Relever. Utiliser.\n\nEt surtout, une plaque qui n'apporte rien à votre image.\nAlors pourquoi ne pas en profiter ?\nChez Standard Forms, notre cache-plaque personnalisable (réf. M1268Q) est conçu pour couvrir les plaques des véhicules exposés sur votre parc ou en showroom. À la place d'un numéro d'immatriculation, vos clients voient votre logo, votre nom, votre\n\nslogan. Une surface de communication propre et professionnelle, directement à la hauteur des yeux.\nEn PVC traité UV, fixation par velcros inclus, personnalisation quadri réalisée à partir de votre charte graphique. Résultat : un parc homogène, une image soignée, et zéro plaque apparente pendant vos expositions.\nRéf. M1268Q à 17,55 € HT l'unité sur standardforms.fr\nBAT adressé sous 48h. Expédition 3 semaines après validation"},{"date":"2026-06-04","m":{"impressions":50,"likes":2,"comments":0,"shares":0,"clicks":2},"text":"Quelque part en France, un acheteur se balade sur un parc automobile.\nIl voit une belle voiture. Il s'arrête. Il regarde. Il cherche le prix.\nRien.\n\nIl repart.\nCe client était prêt à acheter. Il avait le budget. Il avait l'envie.\nMais sans prix affiché, pas de décision.\nEt si la solution tenait à un simple porte-affichette ?\nChez Standard Forms, on fabrique en France des supports de prix format A4 et A3, conçus spécialement pour les professionnels de l'automobile. Mise en place en quelques secondes, rendu professionnel, tarifs dégressifs et expédition sous 48h.\nAvec vos portes ouvertes qui approchent, c'est exactement ce qu'il vous faut.\nModèle A4 (réf. M7734) à partir de 8,86 € HT l'unité\nModèle A3 (réf. M7739SP) à partir de 11,92 € HT l'unité"},{"date":"2026-04-01","m":{"impressions":72,"likes":1,"comments":0,"shares":1,"clicks":1},"text":"BREAKING NEWS\n\nEt si on venait (enfin) de résoudre le problème du carburant… ?\n\nFace à la hausse des prix, un chercheur français affirme avoir découvert un nouveau carburant révolutionnaire : le BIO-BLOB.\nUne ressource auto-régénérante\nUn seul plein pour toute la vie\n20€ le litre… mais rentable à vie\nSimple, durable, économique.\nLes premières stations seraient déjà en test.\nVous y croyez ?\nPoisson d’avril\nMais avouez… vous auriez signé tout de suite.\nChez Standard Forms, on ne crée pas encore de carburant…\nmais on aide déjà les professionnels à booster leur visibilité et leur business.\nVous préparez vos opérations commerciales de printemps ?\nPLV, banderoles, supports : on s’en occupe.\n#poissondavril #marketing #PLV #automobile #innovation"},{"date":"2026-03-19","m":{"impressions":1461,"likes":1,"comments":0,"shares":9,"clicks":8},"text":"Préparez vos portes ouvertes du printemps dès maintenant !\nLes détails font la différence.\nUne PLV visible, professionnelle et bien positionnée peut multiplier votre trafic en concession le jour J.\nBâche, drapeau, roll-up…\nTout est conçu pour attirer l’attention et transformer les passants en clients.\nAnticipez dès aujourd’hui pour être prêt le moment venu.\nContactez-nous pour équiper votre concession efficacement."},{"date":"2026-03-16","m":{"impressions":70,"likes":1,"comments":0,"shares":0,"clicks":5},"text":"Nouvelle réalisation pour Aramisauto\nNous sommes ravis d’avoir accompagné Aramisauto dans la création de ces stylos Crosby Softy Monochrome personnalisés, un objet à la fois discret et très qualitatif.\nCaractéristiques principales :\n• Corps en aluminium avec finition caoutchouc satiné douce et élégante • Design monochrome épuré ; disponible en 3 coloris raffinés • Recharge fine Dokumental® noire ; jusqu’à 650 mètres d’écriture fluide et précise • Gravure laser argent centrée, d’une grande finesse et durable Un BAT (bon à tirer) vous est systématiquement envoyé sous 48 heures après validation de la commande, pour garantir une personnalisation parfaitement conforme à vos attentes.\nUn support idéal pour vos équipes, vos partenaires ou vos opérations de fidélisation client : sobre, utile et représentatif de l’image de marque.\nVous envisagez un projet goodies premium similaire ?\nContactez-nous pour un devis sur mesure, réponse sous 24/48h.\n#StyloPersonnalisé #ObjetsPublicitaires #CadeauEntreprise #ImpressionLaser"},{"date":"2026-03-09","m":{"impressions":1317,"likes":1,"comments":0,"shares":8,"clicks":7},"text":"Attirez plus de clients dans votre concession !\n\nSaviez-vous que la PLV bien placée peut augmenter l’attention des visiteurs de +40% en showroom ?\nTotems, affiches vitrines, stop-rayons, kakemonos… chaque détail compte pour mettre en avant vos offres et vos véhicules.\n\nChez Standard Forms, nous accompagnons les pros de l’auto et de la moto avec des supports personnalisés pour :\nvaloriser vos promotions\naméliorer l’expérience client en concession\nbooster vos ventes\nQuelle PLV utilisez-vous le plus dans votre showroom ?\n#PLV #ConcessionAuto #MarketingAutomobile #Garage"},{"date":"2026-03-02","m":{"impressions":61,"likes":2,"comments":0,"shares":0,"clicks":5},"text":"Découvrez notre nouveau stylo, conçu en Suisse pour répondre aux exigences des professionnels de l’automobile et de la moto. Robuste, ergonomique et élégant, il allie performance et design pour un usage quotidien sans compromis.\n\nFinition mat : Résistant et antidérapant, pour une prise en main optimale.\nConditionnement par 500 : Idéal pour équiper votre atelier ou offrir à vos clients.\nPrécision et fiabilité : Parfait pour signer vos bons de commande, noter vos références ou annoter vos documents.\nUn outil simple, mais essentiel pour gagner en efficacité au quotidien.\nDisponible dès maintenant sur standardforms.fr\n#OutilsPro #StandardForms #EfficacitéAtelier"},{"date":"2026-02-10","m":{"impressions":89,"likes":2,"comments":0,"shares":0,"clicks":7},"text":"La Ferrari Luce n’est pas une voiture. C’est une leçon de marketing donnée par le designer de l’iPhone.\n\nHier, Jony Ive a prouvé qu’on pouvait faire accepter l’électrique aux puristes les plus têtus.\nComment ? En arrêtant de vendre des cylindres pour vendre une interface. En remplaçant le bruit par l’émotion tactile.\nLe luxe ne rugit plus. Il se touche"},{"date":"2026-02-03","m":{"impressions":289,"likes":4,"comments":0,"shares":3,"clicks":13},"text":"5 % de remise sur les nouveaux porte-clés Mugello !\n\nProfitez de l'offre de lancement sur nos porte-clés Mugello fabriqués en Italie.\nEn plus, ils ne rayent pas votre réservoir !\nhttps://www.standardforms.fr/.../1102-325249-porte-cles..."},{"date":"2026-01-13","m":{"impressions":84,"likes":1,"comments":0,"shares":3,"clicks":0},"text":"Ils nous font confiance, et vous ?\n\nChez Standard Forms, nous sommes fiers de compter parmi nos clients des acteurs majeurs comme SUTTEL Group. Pourquoi nous choisissent-ils ? Parce que nous offrons un partenariat fiable, réactif et des produits de qualité pour équiper l’ensemble de vos concessions.\nVous aussi, faites le choix d’un partenaire qui comprend vos enjeux et vous accompagne au quotidien. Contactez-nous dès aujourd’hui pour découvrir comment nous pouvons vous aider à optimiser vos concessions !"},{"date":"2025-12-01","m":{"impressions":62,"likes":0,"comments":0,"shares":0,"clicks":0},"text":"DERNIÈRE PROMO DE L’ANNÉE : -5% SUR TOUS NOS PRODUITS !\nNoël arrive à grands pas, et avec lui, une occasion unique de faire des économies !\n\nCode promo : HOHOHOTTE (valable jusqu’au 31 décembre 2025) Profitez-en pour préparer sereinement l’année à venir avec des moyens de communication professionnels à prix réduit.\nPourquoi attendre ? Offrez-vous un cadeau utile et malin avant la fin de l’année !\n#PromoNoël #StandardForms #Automobile #Moto #Professionnels"},{"date":"2025-11-06","m":{"impressions":63,"likes":0,"comments":0,"shares":0,"clicks":1},"text":"OFFRE SPÉCIALE NOËL : -10% sur TOUS nos calendriers personnalisés !\n\nNoël approche, et c’est le moment idéal pour offrir un cadeau utile à vos clients, partenaires ou collaborateurs ! Découvrez nos calendriers personnalisés :\nCalendriers de bureau : Pratiques et élégants, avec votre logo et vos coordonnées.\nCalendriers muraux : Un format classique pour une visibilité toute l’année.\nEnveloppes \"Bonne Année\" : Pour accompagner vos vœux et marquer les esprits.\nPourquoi choisir nos calendriers ?\nVisibilité garantie : Votre marque sera vue chaque jour.\nCadeau utile et durable : Un présent qui reste toute l’année.\nPersonnalisation totale : Design, couleurs, et messages adaptés à votre activité.\nProfitez de -10% sur tous les calendriers – Une offre limitée pour les fêtes !\n\nCommandez dès maintenant pour recevoir vos calendriers avant Noël et surprendre vos clients.\n#Noël #CadeauxClients #CalendriersPersonnalisés #Promotion #AtelierAuto #StandardForms"},{"date":"2025-11-05","m":{"impressions":78,"likes":0,"comments":0,"shares":0,"clicks":1},"text":"TOP 5 des cadeaux à offrir à vos clients pour Noël !\nNoël, c’est le moment idéal pour remercier vos clients et renforcer votre relation avec eux ! Découvrez notre sélection de 5 cadeaux personnalisés spécialement conçus pour les professionnels de l’automobile et de la moto :\n1. Porte-clés personnalisés – Un cadeau pratique et durable, parfait pour rester visible au quotidien.\n2. Stylos aux couleurs de votre atelier – Un incontournable pour une visibilité discrète mais efficace.\n3. Porte-carte grise personnalisés – Un accessoire utile et élégant pour vos clients.\n4. Disques de stationnement personnalisés – Un cadeau original et pratique pour les automobilistes.\n5. Pochettes de véhicule personnalisées – Parfaites pour ranger les documents importants de leurs véhicules.\nPourquoi offrir ces cadeaux personnalisés ?\nFidélisez vos clients avec des attentions uniques.\nAugmentez votre visibilité toute l’année.\nMarquez les esprits avec des cadeaux utiles et élégants.\nPrêt à surprendre vos clients pour Noël ?\nContactez-nous pour créer des cadeaux 100% personnalisés à l’effigie de votre entreprise !\n#Noël #CadeauxClients #AtelierAuto #Mécanique #Fidélisation #StandardForms"},{"date":"2025-11-03","m":{"impressions":54,"likes":0,"comments":0,"shares":0,"clicks":0},"text":"OFFRE SPÉCIALE MOUSTACHE : -5% SUR TOUTES VOS COMMANDES !\nNovembre, c’est le Movember !\nStandard Forms soutient la santé masculine et vous\noffre 5% de réduction sur toutes vos commandes (hors frais de port) jusqu’au 30 novembre 2025 !\nComment en profiter ?\nUtilisez simplement le code MOUSTACHE lors de votre commande.\nConditions :\nOffre valable sur les produits ne pouvant bénéficier d’aucune autre réduction, à prix déjà remisés, Prix vert, références se terminant par SP et SPZ, réf. D750, Devis, références marques constructeurs auto/moto. Non cumulable avec d’autres offres promotionnelles.\nPartagez cette offre à vos collègues et amis !\n#Movember #StandardForms #Promo #Automobile #Moto #santémasculine"}];

    if(w.length<2||wo.length<2)continue;
    const a=w.reduce((s,p)=>s+er(p),0)/w.length,b=wo.reduce((s,p)=>s+er(p),0)/wo.length;
    out.push({k,label:FL[k],with:a,without:b,diff:b?((a-b)/b*100):0,n:[w.length,wo.length]});
  }
  return out.sort((x,y)=>Math.abs(y.diff)-Math.abs(x.diff));
}

async function claude(system,user,max=3000){
  if(!S.settings.apiKey)throw new Error('Ajoute ta clé API Anthropic dans Réglages.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.model,max_tokens:max,system,messages:[{role:'user',content:user}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erreur '+r.status));
  return j.content.map(c=>c.text||'').join('');
}
function repairJSON(t){
  let out='',inS=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(!inS){out+=c;if(c==='"')inS=true;continue}
    if(c==='\\'){out+=c+(t[i+1]??'');i++;continue}
    if(c==='\n'){out+='\\n';continue}
    if(c==='\r')continue;
    if(c==='\t'){out+='\\t';continue}
    if(c==='"'){const m=t.slice(i+1).match(/^\s*(.)/),n=m?m[1]:'';
      if(!n||',:}]'.includes(n)){out+=c;inS=false}else out+='\\"';continue}
    out+=c}
  return out.replace(/,\s*([}\]])/g,'$1')}
function parseJSON(t){
  t=String(t).replace(/```(?:json)?/gi,'');
  const c=[],a=t.indexOf('{'),b=t.lastIndexOf('}'),x=t.indexOf('['),y=t.lastIndexOf(']');
  const O=a>=0&&b>a?t.slice(a,b+1):null,A=x>=0&&y>x?t.slice(x,y+1):null;
  if(A&&(!O||x<a))c.push(A);if(O)c.push(O);if(A&&!c.includes(A))c.push(A);
  for(const z of c)for(const w of[z,repairJSON(z)]){try{return JSON.parse(w)}catch{}}
  throw new Error('Réponse IA invalide')}
const pDesc=p=>`[${p.platform}] ER ${fmt(er(p))}% | CTR ${fmt(ctr(p))}% | ${p.m.impressions} impr, ${p.m.likes} likes, ${p.m.comments} com., ${p.m.shares} partages, ${p.m.clicks} clics\n"""${p.text}"""`;
function perfContext(){
  const M=measured().sort((a,b)=>er(b)-er(a));
  let c='';
  if(L().rules.length)c+='RÈGLES APPRISES (à appliquer en priorité):\n'+L().rules.map((l,i)=>`${i+1}. ${l}`).join('\n')+'\n\n';
  if(M.length){c+='MEILLEURS POSTS:\n'+M.slice(0,3).map(pDesc).join('\n---\n')+'\n\n';if(M.length>3)c+='PIRES POSTS (à éviter de reproduire):\n'+M.slice(-2).map(pDesc).join('\n---\n')+'\n\n'}
  const ins=insights().slice(0,4);if(ins.length)c+='CORRÉLATIONS:\n'+ins.map(i=>`- ${i.label}: ${fmt(i.with)}% vs ${fmt(i.without)}% sans (${i.diff>0?'+':''}${fmt(i.diff)}%)`).join('\n');
  return c||'Aucune donnée de performance pour le moment: explore des angles variés pour apprendre vite.';
}

  const prev=esc((p.text||'').replace(/\s+/g,' ').slice(0,130));
  return`<details class="card prow" ${openP.has(p.id)?'open':''} ontoggle="this.open?openP.add('${p.id}'):openP.delete('${p.id}')">
  <summary><div class="row" style="gap:8px;flex-wrap:wrap"><span class="tag ${li?'li':'fb'}">${li?'LinkedIn':'Facebook'}</span><span class="tag ${pub?'pub':'draft'}">${pub?'Publié':'Brouillon'}</span><span class="tag">${s[0]} ${s[1]}</span><span class="mut">${dOf(p).toLocaleDateString('fr-FR')}</span><span class="f1"></span>${pub?(hasM(p)?`<span class="good"><b>ER ${fmt(er(p))}%</b></span><span class="mut">${m.impressions} impr. · ${m.clicks||0} clics</span>`:'<span class="badc">⏳ résultats à saisir</span>'):''}</div>
  <div class="mut" style="margin-top:8px">${prev}…</div></summary>
  <div style="margin-top:12px">${postCard(p,true)}</div></details>`}
function vPosts(){
  const all=brandPosts(),pubd=p=>p.status==='published';
  const cnt={draft:all.filter(p=>!pubd(p)).length,published:all.filter(pubd).length,tomeasure:all.filter(p=>pubd(p)&&!hasM(p)).length,all:all.length};
  if(!pf.st)pf.st=cnt.draft?'draft':'published';
  const okSt=p=>pf.st==='all'||(pf.st==='draft'?!pubd(p):pf.st==='published'?pubd(p):pubd(p)&&!hasM(p));
  const list=all.filter(p=>okSt(p)&&(pf.net==='all'||p.platform===pf.net)&&(pf.src==='all'||srcOf(p)===pf.src));
  const byDate=(a,b)=>dOf(b)-dOf(a);
  list.sort(pf.st==='draft'?(a,b)=>SRC_ORD.indexOf(srcOf(a))-SRC_ORD.indexOf(srcOf(b))||byDate(a,b):pf.sort==='er'?(a,b)=>er(b)-er(a):byDate);
  let html='',last='';
  for(const p of list){
    const g=pf.st==='draft'?SRC[srcOf(p)].join(' '):pf.sort==='recent'?dOf(p).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}):'';
    if(g&&g!==last){html+=`<div class="mut" style="margin:20px 0 8px;font-weight:600;text-transform:capitalize">${g}</div>`;last=g}
    html+=postRow(p)}
  const stB=[['draft','✏️ Brouillons',cnt.draft],['published','✅ Publiés',cnt.published],['tomeasure','⏳ À mesurer',cnt.tomeasure],['all','Tous',cnt.all]];
  return`<h1>Mes posts · ${B().name}</h1><p class="sub">Clique sur un post pour le lire, le modifier, le publier ou saisir ses résultats.</p>
  <div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px">${stB.map(([k,l,n])=>`<button class="btn sm ${pf.st===k?'':'sec'}" onclick="pf.st='${k}';render()">${l} (${n})</button>`).join('')}</div>
  <div class="row" style="margin-bottom:8px;gap:10px;flex-wrap:wrap">
    <select style="width:auto" onchange="pf.net=this.value;render()">${opt('all',pf.net,'Tous les réseaux')}${opt('linkedin',pf.net,'LinkedIn')}${opt('facebook',pf.net,'Facebook')}</select>
    <select style="width:auto" onchange="pf.src=this.value;render()">${opt('all',pf.src,'Toutes les origines')}${SRC_ORD.map(k=>opt(k,pf.src,SRC[k].join(' '))).join('')}</select>
    ${pf.st==='draft'?'':`<select style="width:auto" onchange="pf.sort=this.value;render()">${opt('recent',pf.sort,'Plus récents d\'abord')}${opt('er',pf.sort,'Meilleur engagement d\'abord')}</select>`}</div>
  ${list.length?html:`<div class="card empty">Aucun post dans cette vue. ${pf.st==='draft'?`<a href="#" onclick="go('generate');return false" style="color:var(--acc)">Génère-en →</a>`:''}</div>`}`;
}
function vLearn(){
  const ins=insights(),n=measured().length;
  return`<h1>Apprentissage</h1><p class="sub">Comment l'IA s'ajuste en fonction de tes résultats</p>
  <div class="card" style="margin-bottom:14px"><div class="row"><div class="f1"><b>Règles apprises</b><div class="mut">${n} posts mesurés${L().at?` · dernière analyse le ${new Date(L().at).toLocaleDateString('fr-FR')}`:''} · analyse automatique tous les 3 nouveaux posts mesurés</div></div>${S.settings.apiKey?`<button class="btn" onclick="analyze(false)">🔄 Analyser maintenant</button>`:''}</div>
  ${L().summary?`<p style="margin:14px 0">${esc(L().summary)}</p>`:''}
  <div style="margin-top:14px">${L().rules.length?L().rules.map(r=>`<div class="rule">${esc(r)}</div>`).join(''):'<div class="mut">Pas encore de règles. Publie et mesure au moins 3 posts.</div>'}</div></div>
  ${S.settings.apiKey?'':noKey('learn')}
  <div class="card"><b>Corrélations observées (taux d'engagement)</b>${ins.length?`<table style="margin-top:10px"><tr><th>Critère</th><th>Avec</th><th>Sans</th><th>Écart</th></tr>${ins.map(i=>`<tr><td>${i.label}</td><td>${fmt(i.with)}% <span class="mut">(${i.n[0]})</span></td><td>${fmt(i.without)}% <span class="mut">(${i.n[1]})</span></td><td class="${i.diff>0?'good':'badc'}">${i.diff>0?'+':''}${fmt(i.diff)}%</td></tr>`).join('')}</table>`:'<div class="mut" style="margin-top:8px">Il faut au moins 4 posts mesurés.</div>'}</div>`;
}
function vSet(){
  const s=S.settings;
  const pf=(b,k,l)=>`<label>${l}</label><input value="${esc(BP(b)[k])}" onchange="setProf('${b}','${k}',this.value)">`;const inp=(k,l,ph='',t='text')=>`<label>${l}</label><input type="${t}" value="${esc(s[k])}" placeholder="${ph}" onchange="S.settings['${k}']=this.value.trim();save()">`;
  return`<h1>Réglages</h1><p class="sub">Tout est stocké dans ton navigateur (localStorage).</p>
  <div class="card" style="margin-bottom:14px"><div class="row"><div class="f1"><b>📥 Historique Facebook (Standard Forms)</b><div class="mut">${FB_HIST.length} posts de nov. 2025 à juin 2026, avec leurs statistiques. Les posts déjà présents à la même date ne sont pas dupliqués.</div></div><button class="btn sm sec" onclick="importFB(false)">Importer / réimporter</button></div></div>
  <div class="note"><b>Sécurité :</b> ta clé API reste dans ton navigateur et n'est envoyée qu'à Anthropic. Ne partage pas ton ordinateur/profil avec des tiers. Pour un usage multi-clients, il faudra une version avec backend (voir plus bas).</div>
  <div class="card">${inp('apiKey','Clé API Anthropic','sk-ant-…','password')}${inp('model','Modèle','claude-sonnet-5-5')}
  </div>${['sf','immo'].map(b=>`<div class="card" style="margin-top:14px"><b>Profil · ${BR[b].name}</b>${pf(b,'audience','Audience cible')}${pf(b,'tone','Ton éditorial')}${pf(b,'site','URL du site (liens UTM)')}</div>`).join('')}
  <div class="card" style="margin-top:14px"><b>Données</b><div class="row" style="margin-top:10px"><button class="btn sec" onclick="exportData()">⬇ Exporter (JSON)</button><label class="btn sec" style="margin:0;cursor:pointer">⬆ Importer<input type="file" accept=".json" hidden onchange="importData(event)"></label><button class="btn del" onclick="reset()">Tout effacer</button></div></div>
  <div class="card" style="margin-top:14px"><b>Comment sont mesurés les clics ?</b><p class="mut" style="line-height:1.6">Chaque post contenant {{LINK}} reçoit un lien avec des paramètres UTM uniques (<code>utm_campaign=pp_ID</code>). Tu retrouves ces clics dans Google Analytics / Plausible / les stats du réseau, puis tu les saisis dans la fiche du post.</p></div>`;
}
/* ============ AJOUTS : marques, saisie manuelle, tendances ============ */
const brandBar=()=>`<div class="bsw">${Object.keys(BR).map(k=>`<button class="${k===S.cur?'on':''}" onclick="setBrand('${k}')">${BR[k].name} <small>· ${BR[k].short}</small></button>`).join('')}</div>`;
function vGoals(){
  const b=B();
  const row=pl=>{const g=b.pages[pl],c=curFol(S.cur,pl),pct=Math.max(0,Math.min(100,Math.round((c-g.start)/Math.max(1,g.goal-g.start)*100)));
    return`<div class="card"><span class="tag ${pl==='linkedin'?'li':'fb'}">${PLN[pl]} · abonnés</span><div class="kpi"><div class="v">${fmt(c)} <span class="mut">/ ${g.goal}</span></div></div><div class="bar"><i style="width:${pct}%"></i></div><div class="mut">${c>=g.goal?'Objectif atteint 🎉':`Encore ${g.goal-c} · départ : ${g.start}`}</div></div>`};
  const r=S.rev[S.cur]||0;
  return`<div class="g2">${row('linkedin')}${row('facebook')}<div class="card"><span class="tag draft">Avis & témoignages</span><div class="kpi"><div class="v">${r} <span class="mut">/ 5</span></div></div><div class="bar"><i style="width:${Math.min(100,r/5*100)}%"></i></div><div class="mut">Objectif audit : 5 en 3 mois</div></div></div>`}
function vInput(){
  const b=B(),td=new Date().toISOString().slice(0,10),r=S.rev[S.cur]||0;
  const fi=pl=>`<div class="f1"><label>${PLN[pl]} : abonnés actuels</label><input type="number" min="0" id="fo_${pl}" value="${curFol(S.cur,pl)}"></div>`;
  return`<h1>Saisie manuelle · ${b.name}</h1><p class="sub">Trois petits formulaires. Ce que tu saisis alimente le dashboard et l'apprentissage de l'IA.</p>
  <div class="card"><span class="step">1</span><b>Mes abonnés</b><div class="help">À mettre à jour chaque semaine : le nombre affiché sur ta page LinkedIn / Facebook.</div>
  <div class="row">${fi('linkedin')}${fi('facebook')}<div class="f1"><label>Date</label><input type="date" id="fo_d" value="${td}"></div></div>
  <div style="margin-top:14px"><button class="btn" onclick="saveFol()">Enregistrer les abonnés</button></div></div>
  <div class="card" style="margin-top:14px"><span class="step">2</span><b>Un post déjà publié + ses résultats</b><div class="help">Colle le texte du post, puis recopie ses chiffres. LinkedIn : « Voir les statistiques du post ». Facebook : Meta Business Suite › Contenu. Mets 0 si tu n'as pas l'info (sans impressions, le post n'entre pas dans les statistiques). Idéal : 48 h après la publication.</div>
  <div class="row"><div class="f1"><label>Réseau</label><select id="mp"><option value="linkedin">LinkedIn</option><option value="facebook">Facebook</option></select></div><div class="f1"><label>Date de publication</label><input type="date" id="md" value="${td}"></div></div>
  <label>Texte du post</label><textarea id="mt" placeholder="Colle ici le texte publié…"></textarea>
  <div class="m5" style="margin-top:6px">${[['mi','Impressions / vues'],['ml','Likes'],['mc','Commentaires'],['ms','Partages'],['mk','Clics vers le site']].map(([i,l])=>`<div><label>${l}</label><input type="number" min="0" id="${i}" value="0"></div>`).join('')}</div>
  <div style="margin-top:14px"><button class="btn" onclick="saveManual()">Ajouter ce post</button></div></div>
  <div class="card" style="margin-top:14px"><span class="step">3</span><b>Avis Google & témoignages collectés</b><div class="help">Nombre total d'avis / témoignages obtenus pour ${b.name}.</div>
  <div class="row"><div style="width:140px"><input type="number" min="0" id="rv" value="${r}"></div><button class="btn" onclick="saveRev()">Enregistrer</button></div></div>`}
function saveFol(){const d=$('#fo_d').value||new Date().toISOString().slice(0,10);
  ['linkedin','facebook'].forEach(pl=>{const v=$('#fo_'+pl).value;if(v!==''&&+v!==curFol(S.cur,pl))S.fol.push({id:uid(),brand:S.cur,platform:pl,date:d,n:+v,at:Date.now()})});
  save();render();toast('Abonnés enregistrés ✔')}
function saveManual(){
  const t=$('#mt').value.trim();if(!t)return toast('Colle le texte du post.');
  const d=new Date($('#md').value||Date.now()).toISOString(),g=i=>+$('#'+i).value||0;
  S.posts.unshift({id:uid(),brand:S.cur,platform:$('#mp').value,angle:'saisie manuelle',source:'manual',text:t,topic:'',status:'published',createdAt:d,publishedAt:d,m:{impressions:g('mi'),likes:g('ml'),comments:g('mc'),shares:g('ms'),clicks:g('mk')}});
  save();render();toast('Post ajouté ✔');
  const n=measured().length;if(n>=3&&n-L().count>=3)analyze(true)}
function saveRev(){S.rev[S.cur]=+$('#rv').value||0;save();render();toast('Avis enregistrés ✔')}

async function claudeWeb(system,user,max=6000){
  if(!S.settings.apiKey)throw new Error('Ajoute ta clé API Anthropic dans Réglages.');
  let msgs=[{role:'user',content:user}],txt='';
  for(let i=0;i<4;i++){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:S.settings.model,max_tokens:max,system,tools:[{type:'web_search_20250305',name:'web_search',max_uses:6}],messages:msgs})});
    const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Erreur '+r.status));
    txt+=j.content.filter(c=>c.type==='text').map(c=>c.text).join('');
    if(j.stop_reason!=='pause_turn')break;
    msgs=[...msgs,{role:'assistant',content:j.content}];
  }
  return txt}
async function fetchTrends(){
  const b=B(),btn=$('#tr');btn.disabled=true;btn.textContent='Recherche en cours… (30 à 60 s)';
  try{
    const today=new Date().toLocaleDateString('fr-FR');
    const sys=`Tu es stratège social media pour ${b.name} (${b.sector}). Audience: ${b.audience}. Ton: ${b.tone}. Piliers: ${b.pillars}. Tu DOIS t'appuyer sur la recherche web pour identifier ce qui performe actuellement (nous sommes le ${today}). N'invente ni chiffre ni source : si tu ne trouves pas, dis-le. Réponds UNIQUEMENT avec un JSON valide.`;
    const user=`${perfContext()}\n\nRecherche les tendances, formats, accroches et sujets d'actualité qui fonctionnent en ce moment sur LinkedIn et Facebook pour : ${b.topics}. Regarde aussi ce que publient les acteurs de référence du secteur. Produis 4 tendances (title, insight, source = URL réelle trouvée) puis 6 posts prêts à publier (3 LinkedIn, 3 Facebook) qui appliquent ces tendances et les piliers de la marque ; "why" = pourquoi ça devrait marcher. Utilise {{LINK}} pour le lien du site si pertinent. ${IMGR}\nFormat: {"trends":[{"title":"","insight":"","source":""}],"posts":[{"platform":"linkedin|facebook","pillar":"","angle":"","text":"","image":"","why":""}]}`;
    const o=parseJSON(await claudeWeb(sys,user));
    S.trends[S.cur]={at:new Date().toISOString(),trends:o.trends||[],posts:o.posts||[]};save();render();toast('Suggestions mises à jour ✔');
  }catch(e){toast('Erreur : '+e.message,7000);btn.disabled=false;btn.textContent='🔎 Rechercher les tendances maintenant'}}
function addSug(i){const p=S.trends[S.cur].posts[i];
  S.posts.unshift({id:uid(),brand:S.cur,platform:p.platform==='facebook'?'facebook':'linkedin',angle:p.angle||p.pillar||'tendance',text:p.text,image:p.image||'',topic:'Suggestion tendances',status:'draft',createdAt:new Date().toISOString(),m:{impressions:0,likes:0,comments:0,shares:0,clicks:0}});
  save();toast('Ajouté à Mes posts (brouillons) ✔')}
function vTrends(){
  const t=S.trends[S.cur];
  return`<h1>Tendances & idées · ${B().name}</h1><p class="sub">L'IA cherche sur le web ce qui performe dans ton secteur et te propose des posts alignés avec tes piliers.</p>
  <div class="note">La recherche se lance quand tu cliques (pas en continu) : relance-la chaque semaine. Vérifie les sources avant de publier.</div>
  ${!S.settings.apiKey?`<div class="note">⚠️ Ajoute d'abord ta clé API dans <a href="#" onclick="go('settings');return false" style="color:var(--acc)">Réglages</a>, ou utilise le mode sans clé plus bas.</div>`:''}
  <div class="row" style="margin-bottom:16px"><button class="btn" id="tr" onclick="fetchTrends()">🔎 Rechercher les tendances maintenant</button>${t?`<span class="mut">Dernière recherche : ${new Date(t.at).toLocaleString('fr-FR')}</span>`:''}</div>
  ${noKey('trends')}${t?`<div class="g2">${t.trends.map(x=>`<div class="card"><b>${esc(x.title)}</b><p class="help" style="font-size:13px">${esc(x.insight)}</p>${/^https?:\/\//.test(x.source||'')?`<a href="${esc(x.source)}" target="_blank" rel="noopener" style="color:var(--acc);font-size:12px">Source ↗</a>`:`<span class="mut">${esc(x.source||'')}</span>`}</div>`).join('')}</div>
  ${t.posts.map((p,i)=>{const li=p.platform!=='facebook';return`<div class="card post"><div class="row"><span class="tag ${li?'li':'fb'}">${li?'LinkedIn':'Facebook'}</span><span class="mut f1">${esc(p.pillar||'')} · ${esc(p.angle||'')}</span><button class="btn sm ok" onclick="addSug(${i})">➕ Ajouter aux brouillons</button></div><pre>${esc(p.text)}</pre><div class="mut">💡 ${esc(p.why||'')}</div>${p.image?`<div class="mut" style="margin-top:6px">📸 ${esc(p.image)}</div>`:''}</div>`}).join('')}`:`<div class="card empty">Clique sur le bouton pour obtenir des tendances et des idées de posts.</div>`}`}

/* ============ MODE SANS CLÉ API (via Claude.ai) ============ */
function trendsParts(){const b=B();const today=new Date().toLocaleDateString('fr-FR');
    const sys=`Tu es stratège social media pour ${b.name} (${b.sector}). Audience: ${b.audience}. Ton: ${b.tone}. Piliers: ${b.pillars}. Tu DOIS t'appuyer sur la recherche web pour identifier ce qui performe actuellement (nous sommes le ${today}). N'invente ni chiffre ni source : si tu ne trouves pas, dis-le. Réponds UNIQUEMENT avec un JSON valide.`;
    const user=`${perfContext()}\n\nRecherche les tendances, formats, accroches et sujets d'actualité qui fonctionnent en ce moment sur LinkedIn et Facebook pour : ${b.topics}. Regarde aussi ce que publient les acteurs de référence du secteur. Produis 4 tendances (title, insight, source = URL réelle trouvée) puis 6 posts prêts à publier (3 LinkedIn, 3 Facebook) qui appliquent ces tendances et les piliers de la marque ; "why" = pourquoi ça devrait marcher. Utilise {{LINK}} pour le lien du site si pertinent. ${IMGR}\nFormat: {"trends":[{"title":"","insight":"","source":""}],"posts":[{"platform":"linkedin|facebook","pillar":"","angle":"","text":"","image":"","why":""}]}`;
    return[sys,user]}
function genParts(topic,plat,n,goal){const plats=plat==='both'?['linkedin','facebook']:[plat];const user=`${perfContext()}\n\nMISSION: écris ${n} variante(s) par plateforme (${plats.join(', ')}) sur ce sujet: "${topic}". Objectif principal: ${goal}. Chaque variante doit utiliser un ANGLE différent (ex: storytelling, question clivante, liste, retour d'expérience, mythe vs réalité) pour tester ce qui marche. Applique les règles apprises. ${IMGR}\nFormat: {"posts":[{"platform":"linkedin|facebook","angle":"...","text":"...","image":"..."}]}`;
  return[SYS(),user]}
const noKey=k=>`<div class="card" style="margin:14px 0"><b>Mode sans clé API</b> <span class="mut">(avec ton abonnement Claude.ai)</span>
<div class="help"><b>1.</b> ${k==='gen'?'Remplis le sujet ci-dessus, puis clique':'Clique'} sur « Copier le prompt ». <b>2.</b> Colle-le dans une conversation Claude.ai${k==='trends'?' <b>avec la recherche web activée</b>':''}. <b>3.</b> Copie la réponse de Claude et colle-la ci-dessous.</div>
<button class="btn sec" onclick="copyPrompt('${k}')">📋 Copier le prompt</button>
<label>Réponse de Claude</label><textarea id="paste_${k}" placeholder="Colle ici la réponse de Claude (le JSON)…"></textarea>
<div style="margin-top:10px"><button class="btn" onclick="importReply('${k}')">📥 ${k==='gen'?'Créer les brouillons':k==='learn'?'Appliquer les règles':'Importer les suggestions'}</button></div></div>`;
async function copyPrompt(k){
  let p;
  if(k==='gen'){const topic=$('#topic').value.trim();if(!topic)return toast('Indique d\'abord un sujet.');p=genParts(topic,$('#plat').value,+$('#n').value,$('#goal').value).join('\n\n')}
  else if(k==='learn'){const M=measured();if(M.length<3)return toast('Il faut au moins 3 posts publiés avec des résultats.');p=analyzeParts(M).join('\n\n')}
  else p=trendsParts().join('\n\n')+'\n\n(Utilise la recherche web dans cette conversation.)';
  try{await navigator.clipboard.writeText(p+'\n\nRéponds uniquement avec le JSON, dans un seul bloc de code, sans autre texte. Dans les textes des posts, écris les retours à la ligne sous la forme \\n et utilise des guillemets français « » plutôt que des guillemets doubles.');toast('Prompt copié ✔ Colle-le dans Claude.ai',5000)}catch{toast('Copie impossible : autorise le presse-papiers.')}}
function importReply(k){
  const v=$('#paste_'+k).value.trim();if(!v)return toast('Colle d\'abord la réponse de Claude.');
  try{
    const o0=parseJSON(v),o=Array.isArray(o0)?{posts:o0}:o0;
    if(k==='gen'){
      const arr=(o.posts||o.variants||o.drafts||[]).map(p=>({...p,text:p.text||p.texte||p.content||p.post||''})).filter(p=>p.text);if(!arr.length)throw 0;
      const topic=$('#topic')?$('#topic').value.trim():'';
      arr.forEach(p=>S.posts.unshift({id:uid(),brand:S.cur,platform:p.platform==='facebook'?'facebook':'linkedin',angle:p.angle||'',text:p.text,image:p.image||'',topic,status:'draft',createdAt:new Date().toISOString(),m:{impressions:0,likes:0,comments:0,shares:0,clicks:0}}));
      save();toast(arr.length+' brouillons créés ✔');go('posts');
    }else if(k==='learn'){
      const r=(o.rules||[]).filter(x=>typeof x==='string'&&x.trim());if(!r.length)throw 0;
      applyLearn({rules:r,summary:o.summary},measured());render();toast(r.length+' règles appliquées ✔');
    }else{
      if(!(o.posts||[]).length&&!(o.trends||[]).length)throw 0;
      S.trends[S.cur]={at:new Date().toISOString(),trends:o.trends||[],posts:o.posts||[]};save();render();toast('Suggestions importées ✔');
    }
  }catch{
    if(k==='gen'&&v.length>80&&confirm("Je n'arrive pas à lire le JSON. Créer un brouillon avec le texte collé tel quel (tu pourras le corriger) ?")){
      S.posts.unshift({id:uid(),brand:S.cur,platform:'linkedin',angle:'',text:v.replace(/```(?:json)?/gi,'').trim(),image:'',topic:$('#topic')?$('#topic').value.trim():'',status:'draft',createdAt:new Date().toISOString(),m:{impressions:0,likes:0,comments:0,shares:0,clicks:0}});
      save();toast('Brouillon créé ✔ : vérifie et corrige le texte.',6000);go('posts');return}
    toast('Réponse illisible : colle la réponse complète de Claude (tout le bloc JSON), ou demande-lui de renvoyer uniquement le JSON.',7000)}}

importFB(true);
render();
</script>
